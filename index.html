<!doctype html>
<html lang="es" data-tema="claro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2353" />
  <title>Quiniela del Mundial 2026</title>
  <meta name="description" content="Predice los resultados del Mundial 2026: 12 grupos, mejores terceros y bracket eliminatorio interactivo." />
  <link rel="preconnect" href="https://flagcdn.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230b2353'/%3E%3Ccircle cx='32' cy='32' r='18' fill='%23fff'/%3E%3Cpath d='M32 16l4 10h10l-8 6 3 10-9-6-9 6 3-10-8-6h10z' fill='%23ffd24c'/%3E%3C/svg%3E" />
</head>
<body>
  <a class="salto-contenido" href="#vista">Saltar al contenido</a>

  <header class="cabecera" role="banner">
    <div class="cabecera-top">
      <h1 class="logo">
        <span class="logo-icon" aria-hidden="true">
          <!-- Balón inline -->
          <svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="16" cy="16" r="13" fill="#fff" stroke="#0b2353"/>
            <path d="M16 6l5 4-2 6h-6l-2-6z" fill="#0b2353"/>
            <path d="M11 16l-5 3M21 16l5 3M14 22l2 5M18 22l-2 5" stroke="#0b2353"/>
          </svg>
        </span>
        Quiniela <span class="logo-acento">Mundial 2026</span>
      </h1>
      <div class="acciones" role="toolbar" aria-label="Acciones generales">
        <button id="btn-deshacer" class="btn btn-fantasma" type="button" title="Deshacer último cambio">↺ Deshacer</button>
        <button id="btn-reiniciar" class="btn btn-fantasma" type="button" title="Reiniciar quiniela">⟲ Reiniciar</button>
        <button id="btn-exportar" class="btn btn-fantasma" type="button" title="Exportar a JSON">⬇ Exportar</button>
        <button id="btn-tema" class="btn btn-fantasma" type="button" title="Cambiar tema claro/oscuro" aria-label="Cambiar tema">🌓</button>
      </div>
    </div>

    <div id="sesion" class="sesion" aria-label="Sesión actual"></div>

    <div class="progreso">
      <!-- flujo-pasos se inyecta aquí por ui.js -->
      <div class="progreso-track" role="progressbar" aria-label="Progreso de la fase de grupos" aria-valuemin="0" aria-valuemax="100">
        <div id="progreso-bar" class="progreso-bar"></div>
      </div>
    </div>

    <nav id="tabs" class="tabs" role="tablist" aria-label="Fases del torneo"></nav>
  </header>

  <main id="vista" class="vista" tabindex="-1"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <footer class="pie">
    <small>Quiniela del Mundial 2026 · Datos cargados en <code>js/data.js</code>. Predicciones guardadas localmente en tu navegador.</small>
  </footer>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
